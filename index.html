<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div class="main">
        <div class="container">
            <div class="top-bar">
                <button id="theme-toggle" aria-label="Change theme">☀️</button>
            </div>
            <div class="display-container">
                <div class="previous-display">
                    <span id="first-display-number"></span>
                    <span id="display-operator"></span>
                    <span id="second-display-number"></span>
                </div>
                <div id="current-display-number">0</div>
            </div>
            <div class="buttons-container">
                <button id="clear" data-value="Escape">AC</button>
                <button id="backspace" data-value="Backspace">⌫</button>
                <button class="operators" data-value="/">÷</button>
                <button class="operators" data-value="*">x</button>
                <button class="number" data-value="7">7</button>
                <button class="number" data-value="8">8</button>
                <button class="number" data-value="9">9</button>
                <button class="operators" data-value="-">-</button>
                <button class="number" data-value="4">4</button>
                <button class="number" data-value="5">5</button>
                <button class="number" data-value="6">6</button>
                <button class="operators" data-value="+">+</button>
                <button class="number" data-value="1">1</button>
                <button class="number" data-value="2">2</button>
                <button class="number" data-value="3">3</button>
                <button id="operate" data-value="Enter">=</button>
                <button class="number zero" data-value="0">0</button>
                <button class="number" data-value=".">.</button>
            </div>
        </div>
    </div>
    <footer>
        Designed & Developed by
        <a href="https://github.com/MariosKalantzis" target="_blank">
            Marios Kalantzis
        </a>
    </footer>
</body>

</html>
